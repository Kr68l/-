<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог рецептів</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container">

<header class="py-3">
    <h1 class="text-center">Каталог рецептів</h1>
    <nav class="text-center">
        <a class="btn btn-outline-primary" href="Collection of culinary recipes.html">Головна</a>
        <a class="btn btn-primary" href="catalog.html">Каталог</a>
        <a class="btn btn-outline-primary" href="contacts.html">Контакти</a>
    </nav>
</header>

<main>

<section class="my-4">
    <h2>Пошук рецепту</h2>
    <form class="row g-3">
        <div class="col-md-8">
            <input type="text" class="form-control" placeholder="Наприклад: курка">
        </div>
        <div class="col-md-4">
            <button class="btn btn-success w-100">Пошук</button>
        </div>
    </form>
</section>

<section class="my-4">
    <h2>Порівняння рецептів</h2>

    <table class="table table-bordered table-striped text-center">
        <thead class="table-dark">
            <tr>
                <th rowspan="2">Назва</th>
                <th colspan="2">Характеристики</th>
                <th rowspan="2">Порції</th>
            </tr>
            <tr>
                <th>Час</th>
                <th>Складність</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Борщ</td>
                <td>60 хв</td>
                <td>Середня</td>
                <td>4</td>
            </tr>
            <tr>
                <td>Карбонара</td>
                <td>25 хв</td>
                <td>Легка</td>
                <td>3</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td colspan="4">Усі рецепти протестовані</td>
            </tr>
        </tfoot>
    </table>
</section>

<section class="my-4">
    <h2>Розрахунок порцій</h2>
    <form class="row g-3">
        <div class="col-md-6">
            <label class="form-label">Базові порції:</label>
            <input type="number" class="form-control" value="2">
        </div>

        <div class="col-md-6">
            <label class="form-label">Потрібно порцій:</label>
            <input type="number" class="form-control">
        </div>

        <div class="col-12">
            <button class="btn btn-primary">Розрахувати</button>
        </div>
    </form>
</section>

</main>

<footer class="text-center py-3">
    <p>© 2026 Збірник рецептів</p>
</footer>

</div>

</body>
</html>
