<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Контакти | Збірник кулінарних рецептів</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../ооп/styles3.css">
</head>

<body>

<div class="container">

<header class="py-3 text-center">
    <h1>Контакти</h1>
    <nav>
        <a class="btn btn-outline-primary" href="Collection of culinary recipes.html">Головна</a>
        <a class="btn btn-outline-primary" href="catalog.html">Каталог</a>
        <a class="btn btn-primary" href="contacts.html">Контакти</a>
    </nav>
</header>

<main>

<section class="my-4">
<h2>Форма зворотного зв'язку</h2>

<form
    name="contactForm"
    id="contactForm"
    class="row g-3">

<div class="col-md-6 field-box">

    <label for="name" class="form-label">
        Ім'я
    </label>

    <input
        type="text"
        id="name"
        name="name"
        class="form-control"
        required>

</div>

<div class="col-md-6 field-box" >

    <label for="email" class="form-label">
        Email
    </label>

    <input
        type="email"
        id="email"
        name="email"
        class="form-control"
        required>

</div>

<div class="col-md-6 field-box">

    <label for="phone" class="form-label">
        Телефон
    </label>

    <input
        type="tel"
        id="phone"
        name="phone"
        class="form-control"
        placeholder="+380991234567"
        pattern="^\+380\d{9}$"
        required>

</div>

<div class="col-md-6 field-box">

    <label class="form-label">
        Тип звернення
    </label>

    <br>

    <div class="form-check form-check-inline">

        <input
            class="form-check-input"
            type="radio"
            name="type"
            value="question"
            required>

        <label class="form-check-label">
            Питання
        </label>

    </div>

    <div class="form-check form-check-inline">

        <input
            class="form-check-input"
            type="radio"
            name="type"
            value="cooperation">

        <label class="form-check-label">
            Співпраця
        </label>

    </div>

</div>

<div class="col-12 field-box">

    <label for="category" class="form-label">
        Категорія
    </label>

    <select
        id="category"
        name="category"
        class="form-select"
        required>

        <option value="">
            Оберіть категорію
        </option>

        <option>
            Супи
        </option>

        <option>
            Салати
        </option>

        <option>
            Технічна підтримка
        </option>

    </select>

</div>

<div class="col-12 field-box">

    <label for="message" class="form-label">
        Повідомлення
    </label>

    <textarea
        id="message"
        name="message"
        class="form-control"
        rows="4"
        minlength="10"
        required></textarea>

</div>

<div class="col-12 field-box">

    <button
        type="submit"
        class="btn btn-success">

        Надіслати

    </button>

</div>

</form>
</section>

</main>

<footer class="text-center py-3">
    <p>© 2026 Збірник рецептів</p>
</footer>

</div>
</body>
</html>
